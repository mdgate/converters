name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Semver increment (patch is usually automatic; use minor or major for large updates)
        required: true
        type: choice
        options:
          - minor
          - major
          - patch

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'mdgate/converters' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun run test
      - run: bun run pack:check
      - run: bun run version -- ${{ inputs.increment }}
      - run: bun scripts/commit-release.ts
      - run: bun run publish:all
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
